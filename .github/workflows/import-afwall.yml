name: Import AFWall+ source

on:
  push:
    paths:
      - .github/workflows/import-afwall.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Import official AFWall+ source
        run: |
          rm -rf afwall
          git clone --depth 1 --branch beta https://github.com/ukanth/afwall.git /tmp/afwall
          rm -rf /tmp/afwall/.git
          mkdir -p afwall
          cp -a /tmp/afwall/. afwall/

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add afwall
          git commit -m "Add AFWall+ source for modification" || exit 0
          git push
