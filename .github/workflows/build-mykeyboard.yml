name: Build MyKeyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mykeyboard/**'
      - '.github/workflows/build-mykeyboard.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: mykeyboard
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        working-directory: mykeyboard
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" MyKeyboard.apk
          test -f MyKeyboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyKeyboard.apk
          path: mykeyboard/MyKeyboard.apk
          if-no-files-found: error
          compression-level: 0
