name: Build MyKeyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mykeyboard/**'
      - '.github/workflows/build-mykeyboard.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --version

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: mykeyboard
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        working-directory: mykeyboard
        run: cp app/build/outputs/apk/release/app-release.apk MyKeyboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyKeyboard.apk
          path: mykeyboard/MyKeyboard.apk
          if-no-files-found: error
          compression-level: 0
