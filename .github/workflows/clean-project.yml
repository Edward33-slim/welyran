name: 🧹 Clean Project Files

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CLEAN to confirm"
        required: true
        type: string

permissions:
  contents: write

jobs:
  clean-project:
    name: Delete project files (keep Git + Actions)
    if: ${{ inputs.confirm == 'CLEAN' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete project files
        shell: bash
        run: |
          set -euo pipefail

          # Keep .git and .github.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf -- {} +

          # Inside .github, keep only workflows.
          find .github -mindepth 1 -maxdepth 1 \
            ! -name 'workflows' \
            -exec rm -rf -- {} +

          # Keep YAML workflow files only.
          find .github/workflows -mindepth 1 \
            ! -type f -name '*.yml' \
            ! -type f -name '*.yaml' \
            -exec rm -rf -- {} +

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No project files to remove."
            exit 0
          fi

          git commit -m "Clean project files"
          git push
