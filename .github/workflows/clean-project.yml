name: Clean Project Contents

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CLEAN to confirm project cleanup'
        required: true
        type: string

permissions:
  contents: write

jobs:
  clean:
    if: ${{ inputs.confirm == 'CLEAN' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove project contents
        shell: bash
        run: |
          set -euo pipefail

          # Keep Git metadata and GitHub Actions workflows.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf -- {} +

          # Keep only .github/workflows under .github.
          find .github -mindepth 1 -maxdepth 1 \
            ! -name 'workflows' \
            -exec rm -rf -- {} +

          # Remove files/directories inside workflows only if they are not workflow files.
          find .github/workflows -mindepth 1 \
            ! -type f -name '*.yml' \
            ! -type f -name '*.yaml' \
            -exec rm -rf -- {} +

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi

          git commit -m "Clean project contents"
          git push
