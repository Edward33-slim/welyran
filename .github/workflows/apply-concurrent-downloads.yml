name: Apply DownLS10 concurrent downloads

on:
  push:
    paths:
      - '.github/workflows/apply-concurrent-downloads.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch source ZIP
        run: |
          set -eux
          rm -rf project patched.zip verify
          mkdir project
          unzip -q DownLS10.zip -d project
          python3 tools/patch_concurrent_downloads.py
          mv patched.zip DownLS10.zip

          mkdir verify
          unzip -q DownLS10.zip -d verify
          grep -n "التنزيلات المتزامنة" verify/src/main/java/com/downls10/MainActivity.kt
          grep -n "setMaxConcurrentDownloads" verify/src/main/java/com/downls10/DownloadsRepository.kt
          grep -n "ThreadPoolExecutor" verify/src/main/java/com/downls10/DownloadManagerEngine.kt

      - name: Commit patched ZIP
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DownLS10.zip
          git commit -m "Add configurable concurrent downloads to DownLS10"
          git push
