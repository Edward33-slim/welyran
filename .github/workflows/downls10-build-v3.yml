name: DownLS10 APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        run: |
          set -eux
          rm -rf project
          mkdir project
          unzip -o DownLS10.zip -d project
          test -f project/build.gradle.kts
          test -d project/src/main
          mkdir -p project/app
          mv project/build.gradle.kts project/app/build.gradle.kts
          mv project/src project/app/src
          if [ -f project/proguard-rules.pro ]; then mv project/proguard-rules.pro project/app/proguard-rules.pro; fi

          cat > project/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DownLS10"
          include(":app")
          EOF

          cat > project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

          cat > project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.downls10"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.downls10"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 11
                  versionName = "10.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          echo "===== MANIFEST ====="
          sed -n '1,180p' project/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: project
        run: |
          set -eux
          gradle wrapper --gradle-version 8.9
          ./gradlew :app:assembleRelease --stacktrace

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.DOWNLS10_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DOWNLS10_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOWNLS10_KEY_ALIAS }}
        run: |
          set -eux
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/downls10-release.jks"
          APK="$(find project -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)"
          test -n "$APK"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/downls10-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --out "$RUNNER_TEMP/DownLS10-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify "$RUNNER_TEMP/DownLS10-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DownLS10-release-apk
          path: ${{ runner.temp }}/DownLS10-release.apk
          if-no-files-found: error
