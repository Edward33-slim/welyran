name: Package modified DownLS10 source

on:
  push:
    paths:
      - '.github/workflows/package-source.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: DownLS10-modified-source
          path: DownLS10.zip
          if-no-files-found: error
