name: Clear All Actions History

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clear-actions-history:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all workflow runs except this run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Current run: ${GITHUB_RUN_ID}"
          echo "Collecting all workflow run IDs..."

          gh api             --paginate             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"             --jq '.workflow_runs[].id' > /tmp/run_ids

          count=0

          while IFS= read -r RUN_ID; do
            [ -z "${RUN_ID}" ] && continue

            if [ "${RUN_ID}" = "${GITHUB_RUN_ID}" ]; then
              continue
            fi

            echo "Deleting workflow run ${RUN_ID}..."
            if gh api               --method DELETE               -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"; then
              count=$((count + 1))
            else
              echo "Could not delete run ${RUN_ID}; continuing..."
            fi
          done < /tmp/run_ids

          echo "Deleted ${count} old workflow run records."
          echo "The current run is intentionally kept because it is the run executing this cleanup."
