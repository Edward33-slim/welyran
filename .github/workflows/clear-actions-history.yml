name: Import AFWall+ Source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-afwall:
    if: github.repository == 'Edward33-slim/welyran'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clone AFWall+ beta source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch beta https://github.com/ukanth/afwall.git /tmp/afwall

      - name: Replace repository contents with AFWall+
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          rm -rf /tmp/afwall/.git
          cp -a /tmp/afwall/. .

      - name: Commit and push AFWall+ source
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import AFWall+ source"
          git push origin HEAD:main
