name: Clear Actions History

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clear-actions-history:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Current run: ${GITHUB_RUN_ID}"

          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

          echo "The current run deletion request was sent."
