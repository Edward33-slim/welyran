name: Build J7 Prime ROM (on7xelte)

on:
  push:
    branches: [main, rom-builder-on7xelte]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             adb bc bison build-essential ccache curl flex g++-multilib gcc-multilib             git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev             lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev             libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools             xsltproc zip zlib1g-dev unzip python3 python-is-python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+rx "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize LineageOS 19.1 (Android 12L)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rom"
          cd "$GITHUB_WORKSPACE/rom"
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --git-lfs
          mkdir -p .repo/local_manifests
          curl -fsSL https://raw.githubusercontent.com/Exynos7870-Revived-Beta/android_manifest_samsung_universal7870-common/lineage-19.1/7870.xml             -o .repo/local_manifests/7870.xml

      - name: Sync source
        run: |
          cd "$GITHUB_WORKSPACE/rom"
          repo sync -c -j2 --force-sync --no-clone-bundle --no-tags --optimized-fetch
        env:
          GIT_TERMINAL_PROMPT: "0"

      - name: Configure lightweight J7 Prime build
        run: |
          cd "$GITHUB_WORKSPACE/rom"
          cat >> device/samsung/on7xelte/lineage_on7xelte.mk <<'EOF'
          
          # Integrate MindTheGapps 12.1 into the ROM itself
          $(call inherit-product, vendor/gapps/arm64/arm64-vendor.mk)

          # Custom J7 Prime identity
          PRODUCT_BRAND := samsung
          PRODUCT_MANUFACTURER := samsung
          PRODUCT_MODEL := Galaxy J7 Prime
          PRODUCT_DEVICE := on7xelte
          PRODUCT_GMS_CLIENTID_BASE := android-samsung
          EOF

          mkdir -p vendor/lineage
          cat > vendor/lineage/privapp-permissions-custom.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
          </permissions>
          EOF

      - name: Build ROM
        run: |
          cd "$GITHUB_WORKSPACE/rom"
          source build/envsetup.sh
          lunch lineage_on7xelte-userdebug
          export USE_CCACHE=1
          ccache -M 20G
          m bacon -j2

      - name: Collect ROM
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out-rom"
          find "$GITHUB_WORKSPACE/rom/out/target/product/on7xelte" -maxdepth 1 -type f \(             -name "*.zip" -o -name "boot.img" -o -name "recovery.img" -o -name "dtbo.img"           \) -exec cp -v {} "$GITHUB_WORKSPACE/out-rom/" \;
          sha256sum "$GITHUB_WORKSPACE"/out-rom/* > "$GITHUB_WORKSPACE/out-rom/SHA256SUMS.txt"
          ls -lh "$GITHUB_WORKSPACE/out-rom"

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: J7-Prime-on7xelte-Android-12L
          path: out-rom/
          if-no-files-found: error
          retention-days: 14
