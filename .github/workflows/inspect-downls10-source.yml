name: Inspect DownLS10 Source

on:
  push:
    branches: [ main ]
    paths:
      - 'BUILD_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply link colors patch to ZIP
        run: |
          set -euxo pipefail
          rm -rf project
          mkdir project
          unzip -q DownLS10.zip -d project
          test -f project/src/main/java/com/downls10/BrowserActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/src/main/java/com/downls10/BrowserActivity.kt")
          s = p.read_text(encoding="utf-8")

          old_css = 'color: #B388FF !important; -webkit-text-fill-color: #B388FF !important;'
          new_css = 'color: #800080 !important; -webkit-text-fill-color: #800080 !important;'
          if old_css not in s:
              raise SystemExit("visited CSS not found")
          s = s.replace(old_css, new_css, 1)

          old_line = "if (info.host !== pageHost) a.style.color = '#00FFFF';"
          new_line = "if (isSearchPage()) a.style.color = '#87CEEB';"
          if old_line not in s:
              raise SystemExit("unvisited color line not found")
          s = s.replace(old_line, new_line, 1)

          anchor = "                function markLink(a) {"
          helper = "\n".join([
              "                function isSearchPage() {",
              "                    return /(^|\\\\.)google\\\\.[a-z.]+$/.test(pageHost) ||",
              "                           /(^|\\\\.)bing\\\\.com$/.test(pageHost) ||",
              "                           /(^|\\\\.)search\\\\.yahoo\\\\.com$/.test(pageHost) ||",
              "                           /(^|\\\\.)duckduckgo\\\\.com$/.test(pageHost) ||",
              "                           /(^|\\\\.)yandex\\\\.[a-z.]+$/.test(pageHost) ||",
              "                           /(^|\\\\.)search\\\\.brave\\\\.com$/.test(pageHost);",
              "                }",
              ""
          ])
          if "function isSearchPage()" not in s:
              if anchor not in s:
                  raise SystemExit("search helper insertion point not found")
              s = s.replace(anchor, helper + anchor, 1)

          old_return = 'return if (isVisitedSite(url)) Color.parseColor("#B388FF") else unvisitedColor'
          new_return = 'return Color.GRAY'
          if old_return not in s:
              raise SystemExit("browser color helper not found")
          s = s.replace(old_return, new_return, 1)
          s = s.replace('unvisitedColor: Int = Color.parseColor("#00FFFF")', 'unvisitedColor: Int = Color.GRAY', 1)

          p.write_text(s, encoding="utf-8")
          PY

          echo "=== VERIFY ==="
          grep -nE '#800080|#87CEEB|isSearchPage|return Color.GRAY' project/src/main/java/com/downls10/BrowserActivity.kt

          rm -f DownLS10.zip
          (cd project && zip -qr ../DownLS10.zip .)
          test -s DownLS10.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DownLS10.zip
          git diff --cached --quiet || git commit -m "Update DownLS10 visited and search link colors [skip ci]"
          git push
