name: Delete All Actions History

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete-history:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t RUN_IDS < <(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[].id'
          )

          echo "Found ${#RUN_IDS[@]} workflow runs."

          for run_id in "${RUN_IDS[@]}"; do
            echo "Deleting workflow run: $run_id"
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done

          echo "All Actions workflow runs have been deleted."
