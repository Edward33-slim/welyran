name: Delete All Actions History

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE-ACTIONS to confirm"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  delete-history:
    if: ${{ inputs.confirm == 'DELETE-ACTIONS' }}
    runs-on: ubuntu-latest

    steps:
      - name: Delete all other workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          gh api --paginate \
            "/repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' |
          while read -r RUN_ID; do
            [ -z "$RUN_ID" ] && continue

            if [ "$RUN_ID" = "$CURRENT_RUN_ID" ]; then
              echo "Keeping current run: $RUN_ID"
              continue
            fi

            echo "Deleting workflow run: $RUN_ID"
            gh api \
              --method DELETE \
              "/repos/$REPO/actions/runs/$RUN_ID" || true
          done

      - name: Delete all artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate \
            "/repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read -r ID; do
            [ -z "$ID" ] && continue

            echo "Deleting artifact: $ID"
            gh api \
              --method DELETE \
              "/repos/$REPO/actions/artifacts/$ID" || true
          done

          echo "Finished. The current workflow run is intentionally kept by GitHub."
