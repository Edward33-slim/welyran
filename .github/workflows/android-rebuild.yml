name: DownLS10 Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert CodeAssist ZIP to Gradle project
        run: |
          set -eux
          rm -rf project
          mkdir -p project
          unzip -o DownLS10.zip -d project
          test -f project/build.gradle.kts
          test -d project/src/main

          mkdir -p project/app
          mv project/build.gradle.kts project/app/build.gradle.kts
          mv project/src project/app/src
          if [ -f project/proguard-rules.pro ]; then
            mv project/proguard-rules.pro project/app/proguard-rules.pro
          fi

          cat > project/settings.gradle.kts <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "DownLS10"
include(":app")
EOF

          cat > project/build.gradle.kts <<'EOF'
plugins {
    id("com.android.application") version "8.7.3" apply false
    id("org.jetbrains.kotlin.android") version "2.0.21" apply false
}
EOF

          echo "===== app/build.gradle.kts ====="
          sed -n '1,240p' project/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        working-directory: project
        run: gradle wrapper --gradle-version 8.9

      - name: Check Gradle Android tasks
        working-directory: project
        run: ./gradlew :app:tasks --all --stacktrace

      - name: Build release APK
        working-directory: project
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign release APK with DownLS10 key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOWNLS10_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DOWNLS10_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOWNLS10_KEY_ALIAS }}
        run: |
          set -eux
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/downls10-release.jks"

          APK="$(find project/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          SDK_BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$SDK_BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$SDK_BUILD_TOOLS/apksigner"

          "$ZIPALIGN" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/downls10-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --out "$RUNNER_TEMP/DownLS10-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/DownLS10-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DownLS10-rebuilt-release-apk
          path: ${{ runner.temp }}/DownLS10-release.apk
          if-no-files-found: error
