name: Inspect DownLS10 source

on:
  push:
    paths:
      - '.github/workflows/inspect-downls10.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect repository
        run: |
          rm -rf project
          mkdir project
          unzip -q DownLS10.zip -d project
          echo "=== DownloadsRepository.kt ==="
          sed -n '1,420p' project/src/main/java/com/downls10/DownloadsRepository.kt
