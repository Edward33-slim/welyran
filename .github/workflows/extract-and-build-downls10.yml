name: Extract and Build DownLS10

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source ZIP into repository
        shell: bash
        run: |
          set -euxo pipefail

          test -f DownLS10-modified-code.zip
          rm -rf "$RUNNER_TEMP/downls10-source"
          mkdir -p "$RUNNER_TEMP/downls10-source"
          unzip -q DownLS10-modified-code.zip -d "$RUNNER_TEMP/downls10-source"

          SRC="$RUNNER_TEMP/downls10-source"
          mapfile -t TOP_DIRS < <(find "$SRC" -mindepth 1 -maxdepth 1 -type d ! -name "__MACOSX" -printf '%f\n' | sort)
          mapfile -t TOP_FILES < <(find "$SRC" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)

          if [ "${#TOP_DIRS[@]}" -eq 1 ] && [ "${#TOP_FILES[@]}" -eq 0 ]; then
            SRC="$SRC/${TOP_DIRS[0]}"
          fi

          echo "Using extracted source: $SRC"
          find "$SRC" -maxdepth 2 -type f | sort | head -200

          shopt -s dotglob nullglob
          for item in "$SRC"/*; do
            name="$(basename "$item")"
            case "$name" in
              .github|.git) continue ;;
            esac
            rm -rf "./$name"
            cp -a "$item" "./$name"
          done

          rm -f DownLS10-modified-code.zip

      - name: Show Android project
        shell: bash
        run: |
          set -eux
          echo "===== ROOT ====="
          ls -la
          echo "===== GRADLE FILES ====="
          find . -maxdepth 4 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradlew' \) -print | sort

      - name: Commit extracted source
        id: commit
        shell: bash
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Extract DownLS10 modified source"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extracted source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Gradle project
        shell: bash
        run: |
          set -eux
          if [ -f ./gradlew ]; then
            echo "GRADLE_ROOT=." >> "$GITHUB_ENV"
          else
            ROOT="$(find . -maxdepth 4 -type f -name gradlew -print -quit | xargs -r dirname)"
            test -n "$ROOT"
            echo "GRADLE_ROOT=$ROOT" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        shell: bash
        run: |
          set -eux
          cd "$GRADLE_ROOT"
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$GRADLE_ROOT" -type f -path '*/build/outputs/apk/release/*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          test -n "$(find "$GITHUB_WORKSPACE/apk-output" -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownLS10-release-apk
          path: apk-output/*.apk
          if-no-files-found: error
